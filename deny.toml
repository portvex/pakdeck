# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates are always errors; also fail on
# yanked versions. Unmaintained-crate notices are errors for direct deps.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses compatible with distributing pakdeck under MIT. Only
# licenses actually in the tree are listed; add more here when needed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
